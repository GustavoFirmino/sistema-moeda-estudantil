# ==========================================
# Moeda Estudantil — Application Properties
# ==========================================

spring.application.name=moeda-estudantil

# --- Servidor (PORT definido pela nuvem; 8080 local) ---
server.port=${PORT:8080}

# --- Banco de Dados (PostgreSQL) ---
# Local: usa os defaults abaixo (docker compose). Nuvem (Render): variáveis DB_* injetadas.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moeda_estudantil}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Upload de arquivos ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Email (desativado por padrao - apenas loga no console) ---
app.email.enabled=${APP_EMAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# --- Logging ---
logging.level.com.pucminas.moedaestudantil=INFO
logging.level.org.springframework.security=WARN
